name: nRF Firmware Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build nrf54lm20dk_debug
    runs-on: ubuntu-latest

    env:
      NCS_VERSION: v3.2.4
      NCS_PARENT_DIR: ${{ github.workspace }}/ncs
      NCS_DIR: ${{ github.workspace }}/ncs/v3.2.4

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            curl \
            tar \
            ninja-build \
            gperf \
            device-tree-compiler \
            python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install West
        run: python -m pip install --upgrade pip west

      - name: Install nrfutil
        run: |
          curl -L https://files.nordicsemi.com/ui/api/v1/download?repoKey=swtools\&path=external/nrfutil/packages/nrfutil/nrfutil-x86_64-unknown-linux-gnu-8.1.1.tar.gz -o nrfutil.tar.gz
          tar -xzf nrfutil.tar.gz
          install -m 0755 nrfutil-x86_64-unknown-linux-gnu-8.1.1/data/bin/nrfutil /usr/local/bin/nrfutil
          export PATH="/usr/local/bin:${PATH}"
          hash -r
          nrfutil --help

      - name: Cache NCS Workspace
        id: cache-ncs
        uses: actions/cache@v5
        with:
          path: ${{ env.NCS_PARENT_DIR }}
          key: ${{ runner.os }}-ncs-${{ env.NCS_VERSION }}

      - name: Fetch nRF Connect SDK
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${NCS_PARENT_DIR}"
          cd "${NCS_PARENT_DIR}"
          west init -m https://github.com/nrfconnect/sdk-nrf --mr "${NCS_VERSION}" "${NCS_VERSION}"
          cd "${NCS_DIR}"
          west update

      - name: Install Nordic Toolchain
        run: |
          export PATH="/usr/local/bin:${PATH}"
          hash -r
          nrfutil install sdk-manager
          nrfutil sdk-manager install "${NCS_VERSION}"

      - name: Build Firmware
        env:
          ZEPHYR_BASE: ${{ env.NCS_DIR }}/zephyr
        run: |
          export PATH="/usr/local/bin:${PATH}"
          hash -r
          nrfutil sdk-manager toolchain launch \
            --ncs-version "${NCS_VERSION}" \
            --chdir "${{ github.workspace }}/nrf_firmware" \
            -- \
            west build -p always \
              -b nrf54lm20dk/nrf54lm20a/cpuapp \
              "${{ github.workspace }}/nrf_firmware" \
              --build-dir "${{ github.workspace }}/nrf_firmware/build" \
              -- \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Upload Build Artifacts
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nrf-firmware-nrf54lm20dk_debug
          path: |
            nrf_firmware/build/zephyr/zephyr.elf
            nrf_firmware/build/zephyr/zephyr.hex
            nrf_firmware/build/zephyr/zephyr.bin
            nrf_firmware/build/zephyr/zephyr.map
            nrf_firmware/build/compile_commands.json
          retention-days: 14
