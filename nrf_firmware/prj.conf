# Enable printk for console output
CONFIG_PRINTK=y

# Enable hwinfo for reading device unique ID
CONFIG_HWINFO=y

# Enable reboot API used by the CLI
CONFIG_REBOOT=y

# Deferred logging — non-blocking, flushes asynchronously
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Enable basic audio serial and codec control drivers
CONFIG_I2S=y
CONFIG_I2C=y

# Enable k_poll() used by the prop_gfsk link thread
CONFIG_POLL=y
