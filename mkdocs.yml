site_name: FlexAudioLink
site_description: Low-latency wireless audio bridge
site_url: https://gab.github.io/FlexAudioLink/
repo_url: https://github.com/gab/FlexAudioLink
repo_name: FlexAudioLink

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Firmware:
      - Overview: firmware/index.md
      - Audio Path: firmware/audio-path.md
      - I2S/TDM: firmware/i2s-tdm.md
      - NAU88L21 Codec: firmware/nau88l21-codec.md
      - PROP TDD: firmware/prop-tdd.md
      - Latency Measurement: firmware/latency_measurement.md
  - Hardware: hardware.md
  - Web UI: webui.md
  - CLI Reference: cli.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
