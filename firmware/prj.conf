# Enable printk for console output
CONFIG_PRINTK=y

# Enable hwinfo for reading device unique ID
CONFIG_HWINFO=y

# Enable reboot API used by the CLI
CONFIG_REBOOT=y

# Deferred logging — non-blocking, flushes asynchronously
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Enable basic audio serial and codec control drivers
CONFIG_I2S=y
CONFIG_I2S_NRF_TDM_TX_BLOCK_COUNT=16
CONFIG_I2S_NRF_TDM_RX_BLOCK_COUNT=16
CONFIG_I2C=y

# Enable k_poll() used by the PFSK session thread
CONFIG_POLL=y

# Zephyr thread metadata for VS Code RTOS Views (Zephyr backend)
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# Flash / RRAM driver
CONFIG_FLASH=y
CONFIG_SOC_FLASH_NRF_RRAM=y

# Settings / persistent mode storage
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y

# -O0, no inlining
# CONFIG_NO_OPTIMIZATIONS=y